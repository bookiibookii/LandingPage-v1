<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>문의하기 — 부키부키 BOOKIIBOOKII</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
      onload="this.rel = 'stylesheet'"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css"
    /></noscript>
    <link rel="icon" href="assets/symbol_default.ico" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .legal-page {
        max-width: 740px;
        margin: 0 auto;
        padding: 80px 24px 120px;
      }
      .legal-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--ink-3);
        text-decoration: none;
        transition: color 0.2s;
      }
      .legal-back:hover {
        color: var(--ink-1);
      }
      .legal-page h1 {
        font-size: 28px;
        font-weight: 700;
        color: var(--ink-1);
        margin-bottom: 8px;
      }
      .legal-page .lead {
        font-size: 15px;
        line-height: 1.8;
        color: var(--ink-2);
        margin-bottom: 40px;
      }
      .legal-divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 48px 0;
      }
      html {
        overflow-y: scroll;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
      }
      .nav {
        background: rgba(255, 255, 255, 0.92) !important;
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid var(--g200) !important;
      }

      /* Contact-specific */
      .contact-cards {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .contact-card {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 24px 28px;
        border-radius: 16px;
        border: 1.5px solid var(--border);
        background: var(--surface);
        text-decoration: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s,
          transform 0.2s;
      }
      .contact-card:hover {
        border-color: var(--accent);
        box-shadow: 0 8px 24px rgba(16, 15, 14, 0.08);
        transform: translateY(-2px);
      }
      .contact-card-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .contact-card-icon.google {
        background: #f0f4ff;
      }
      .contact-card-icon.kakao {
        background: #fee500;
      }
      .contact-card-body {
        flex: 1;
      }
      .contact-card-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink-1);
        margin-bottom: 4px;
      }
      .contact-card-desc {
        font-size: 14px;
        color: var(--ink-3);
        line-height: 1.5;
      }
      .contact-card-arrow {
        font-size: 18px;
        color: var(--ink-3);
        flex-shrink: 0;
      }
      .contact-email {
        font-size: 14px;
        color: var(--ink-3);
      }
      .contact-email a {
        color: var(--accent);
        text-decoration: none;
      }
      .contact-email a:hover {
        text-decoration: underline;
      }

      @media (max-width: 480px) {
        .contact-card {
          padding: 20px;
          gap: 14px;
        }
        .contact-card-icon {
          width: 40px;
          height: 40px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav" id="nav">
      <div class="wrap">
        <a href="index.html" class="brand" aria-label="부키부키 홈">
          <img
            class="wordmark"
            src="assets/wordmark-bookiibookii.png"
            alt="BOOKIIBOOKII"
          />
        </a>
        <a href="index.html" class="legal-back">← 홈으로 돌아가기</a>
      </div>
    </nav>

    <main>
      <div class="legal-page">
        <h1>문의하기</h1>
        <p class="lead">
          서비스 이용 중 궁금한 점이나 불편한 점이 있으시면 아래 채널로 편하게
          문의해 주세요.
        </p>

        <div class="contact-cards">
          <a
            href="https://forms.gle/eq4XtRZfRjEbc1C76"
            class="contact-card"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="contact-card-icon google">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2z"
                  fill="#4285F4"
                />
                <path
                  d="M20 4l-8 9-8-9"
                  stroke="white"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
              </svg>
            </div>
            <div class="contact-card-body">
              <div class="contact-card-title">문의 양식 작성하기</div>
              <div class="contact-card-desc">
                구글 폼으로 문의 내용을 남겨주시면 순서대로 답변드려요.
              </div>
            </div>
            <span class="contact-card-arrow">→</span>
          </a>

          <a
            href="http://pf.kakao.com/_cIxlxjX"
            class="contact-card"
            target="_blank"
            rel="noopener noreferrer"
          >
            <div class="contact-card-icon kakao">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 3C7.03 3 3 6.36 3 10.5c0 2.7 1.72 5.07 4.32 6.43l-1.1 4.08 4.77-3.15c.33.04.67.07 1.01.07 4.97 0 9-3.36 9-7.5S16.97 3 12 3z"
                  fill="#3A1D1D"
                />
              </svg>
            </div>
            <div class="contact-card-body">
              <div class="contact-card-title">카카오톡 1:1 상담</div>
              <div class="contact-card-desc">
                카카오톡 채널에서 빠르게 1:1로 상담받으세요.
              </div>
            </div>
            <span class="contact-card-arrow">→</span>
          </a>
        </div>

        <hr class="legal-divider" />
        <p class="contact-email">
          이메일로도 문의하실 수 있어요 →
          <a href="mailto:bookkiibookkii@gmail.com">bookkiibookkii@gmail.com</a>
        </p>
      </div>
    </main>

    <footer class="footer">
      <div class="wrap">
        <div class="left">
          <span class="brand" style="color: white">부키부키</span>
          <span class="copyright"
            >© 2026 BOOKIIBOOKII. All rights reserved.</span
          >
        </div>
        <div class="footer-links">
          <a href="index.html#why">서비스 소개</a>
          <a href="terms.html">이용약관</a>
          <a href="privacy.html">개인정보처리방침</a>
          <a href="contact.html">문의하기</a>
        </div>
      </div>
    </footer>
  </body>
</html>
